<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tomespot MCP ローカルデモ</title>
<style>body{font:16px/1.7 system-ui,sans-serif;margin:36px auto;padding:0 20px;max-width:1080px;color:#153c39;background:#f6faf8}h1{font-size:28px}form,article{background:white;padding:22px;border:1px solid #ccdcd6;border-radius:12px;margin:18px 0}input,select,button{font:inherit;padding:8px;border:1px solid #9abbb1;border-radius:6px;margin:4px}button{background:#145f50;color:white;cursor:pointer}a{color:#146b9a;margin-right:14px}p{margin:8px 0}summary{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f5f4;padding:12px;font-size:12px}.note{color:#5e6b64}.state{font-weight:600}label{display:inline-block}.comments-section{border-top:1px solid #dce2d8;margin-top:28px;padding-top:20px}.comment-help{font-size:13px;line-height:1.7;color:#647363}.comment-form{margin-top:24px;padding:18px;background:#f2f5ef;border:0;border-radius:16px}.comment-form h4{margin-top:0}.comment-form label{display:block;font-size:13px;font-weight:600;margin:16px 0 8px}.comment-form textarea{display:block;width:100%;box-sizing:border-box;border:1px solid #ccd5c8;border-radius:10px;margin-top:8px;padding:12px;font:inherit;resize:vertical;background:white;color:#173c34}.comment-form button,.comments-more{border:1px solid #ccd5c8;background:#153e35;color:white;border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer}.comment-form button:disabled{opacity:.55;cursor:wait}.comment-status{font-size:14px;line-height:1.6;color:#214f3c;white-space:pre-wrap}.visitor-comment{padding:16px 0;border-bottom:1px solid #e0e6dc}.comment-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}@media(max-width:760px){.comment-form{padding:12px}}</style>
<h1>Tomespot · ChatGPT 接続のローカルデモ</h1><p>公開駐輪場データを、ChatGPT と同じ MCP ツールで検索します。実際の ChatGPT 上での回答生成は接続後に確認してください。本デモからのコメント送信はテストのみで、正式サイトには投稿されません。</p>
<form id="search"><label>駅・住所・施設名 <input id="query" value="横浜駅" required maxlength="160"></label><label>車種 <select id="vehicle"><option value="bicycle">自転車</option><option value="privateElectricScooter">電動キックボード</option><option value="motorcycle">原付・バイク</option></select></label><label>利用方式 <select id="usage"><option value="any">指定なし</option><option value="temporary">一時利用</option><option value="regular">定期・年度登録</option></select></label><label><input type="checkbox" id="unknown">未確認も表示</label><button>検索</button></form>
<p class="note">リアルタイム空位は未提供。直線距離は徒歩距離ではありません。料金の期間・車両区分・資格を確認してください。原付可から大型二輪可を推定しません。</p><p id="status" role="status"></p><div id="results"></div>
<script type="module">
const $=id=>document.getElementById(id),esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');let id=0;
const mode=s=>({confirmed:'確認済み',not_offered:'提供なし',unverified:'未確認',confirmed_application_required:'申請・登録が必要',confirmed_annual_registration_required:'年度登録が必要',not_monthly_annual_registration_only:'年度登録のみ',class_dependent:'車両区分により異なる'}[s]||'未確認');
async function rpc(method,params){const r=await fetch('/mcp',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json, text/event-stream'},body:JSON.stringify({jsonrpc:'2.0',id:++id,method,params})});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(d.error)throw Error(d.error.message);return d.result;}
await rpc('initialize',{protocolVersion:'2025-03-26',capabilities:{},clientInfo:{name:'tomespot-local-demo',version:'1.0.0'}});
$('search').onsubmit=async e=>{e.preventDefault();$('results').textContent='';$('status').textContent='検索中…';try{const r=await rpc('tools/call',{name:'search_parking',arguments:{query:$('query').value,vehicle:$('vehicle').value,usage:$('usage').value,include_unconfirmed:$('unknown').checked,limit:5}});if(r.isError)throw Error(r.content[0].text);const d=r.structuredContent;$('status').textContent=d.needsClarification?d.message:`${d.total}件（最大5件表示） · ${d.message}`;for(const p of d.results||[]){const el=document.createElement('article');el.innerHTML=`<h2>${esc(p.name)}</h2><p>${esc(p.address)} · ${p.distanceM===null?'距離未算出':esc(p.distanceM)+'m（直線）'}</p><p><a href="${esc(p.links.facility)}" target="_blank" rel="noopener">Tomespot 施設地図</a><a href="${esc(p.links.map)}" target="_blank" rel="noopener">Google マップ</a></p>${Object.entries(p.profiles).map(([k,q])=>`<h3>${esc({bicycle:'自転車',privateElectricScooter:'電動キックボード',moped:'原付',motorcycle:'その他二輪'}[k])}</h3><p class="state">${esc(q.statusLabel)}</p><p>車両条件：${esc(q.classesRaw?.length?q.classesRaw.join(' / '):'未確認・詳細原資料を確認')}</p><p>一時利用：${esc(mode(q.temporaryStatus))} / 定期：${esc(mode(q.regularStatus))}</p><p>公表料金：${esc(q.publishedFeesRaw||'下の料金原資料を確認。記載がない場合は未確認。')}</p><details><summary>料金・寸法・資格・利用制限・出典の原資料</summary><pre>${esc(JSON.stringify(q,null,2))}</pre></details>`).join('')}<p class="note">データ取得：${esc(p.snapshotRetrievedAt)}。各条件の確認日は原資料内に記載。</p>`;$('results').append(el);}}catch(err){$('status').textContent=err.message;}};
// Reviews display immediately. The form's Send click is the customer's explicit submission.
const observer=new MutationObserver(()=>{
  for(const card of $('results').children){
    if(card.dataset.reviewControls)continue;card.dataset.reviewControls='yes';
    const facility=new URL(card.querySelector('a').href).searchParams.get('place'),selectedVehicle=$('vehicle').value;
    const section=document.createElement('section');section.className='comments-section';
    const heading=document.createElement('h3');heading.textContent='利用者のコメント';
    const panel=document.createElement('div');panel.setAttribute('aria-live','polite');panel.textContent='読み込み中…';
    let offset=0;const more=document.createElement('button');more.type='button';more.className='comments-more';more.textContent='もっと見る';more.hidden=true;
    async function load(){more.disabled=true;try{const r=await rpc('tools/call',{name:'get_parking_reviews',arguments:{id:facility,vehicle:selectedVehicle,offset}});if(r.isError)throw Error(r.content[0].text);const d=r.structuredContent;if(!section.isConnected)return;if(offset===0)panel.replaceChildren();
      if(!d.comments.length&&offset===0){const empty=document.createElement('p');empty.className='comment-help';empty.textContent='まだ公開されたコメントはありません。';panel.append(empty);}
      for(const c of d.comments){const item=document.createElement('div');item.className='visitor-comment';const meta=document.createElement('p'),body=document.createElement('p');meta.className='comment-help';body.className='comment-text';meta.textContent=new Date(c.createdAt).toLocaleDateString('ja-JP')+' · '+c.vehicleLabel+(c.displayKind==='website_reviewed_summary'?' · 要約':'');body.textContent=c.body;item.append(meta,body);panel.append(item);}
      offset+=d.returnedCount;more.hidden=!d.more;more.textContent='もっと見る';
    }catch(e){if(offset===0)panel.textContent='コメントを読み込めませんでした。';more.hidden=false;more.textContent='再読み込み';}finally{more.disabled=false;}}
    more.onclick=load;
    const form=document.createElement('form');form.className='comment-form';form.innerHTML='<h4>現地で気づいたことを教えてください</h4><p class="comment-help">登録不要。内容は確認後に公開され、すぐには表示されません。</p><label>コメント（2,000文字まで）<textarea required maxlength="2000" rows="4" aria-label="コメント本文"></textarea></label><button type="submit">送信</button><p class="comment-status" role="status"></p>';
    let pending=null;form.onsubmit=async e=>{e.preventDefault();const status=form.querySelector('[role=status]'),field=form.querySelector('textarea'),button=form.querySelector('button');const body=field.value.trim();if(!body)return;button.disabled=true;field.disabled=true;button.textContent='送信中…';status.textContent='';try{
      if(!pending||pending.body!==body){const r=await rpc('tools/call',{name:'prepare_parking_feedback',arguments:{id:facility,vehicle:selectedVehicle,body}});if(r.isError)throw Error(r.content[0].text);pending={body,token:new URL(r.structuredContent.confirmationUrl).hash.slice(1)};}
      const response=await fetch('/feedback',{method:'POST',headers:{'Content-Type':'application/json','X-Tomespot-Confirm':'yes'},body:JSON.stringify({draft:pending.token})});const result=await response.json();if(!response.ok)throw Error(result.error||'submit_failed');status.textContent=result.status==='demo_only'?'デモ送信を確認しました。正式サイトには送信していません。':'受け付けました。確認待ちのため、まだ公開されていません。';field.value='';pending=null;
    }catch(error){status.textContent=error.message==='rate_limit'?'投稿回数の上限です。時間をおいてお試しください。':'送信できませんでした。時間をおいて再度お試しください。';if(error.message==='invalid_or_expired_draft')pending=null;}finally{button.disabled=false;field.disabled=false;button.textContent='送信';}};
    section.append(heading,panel,more,form);card.append(section);load();
  }
});observer.observe($('results'),{childList:true});
</script></html>
